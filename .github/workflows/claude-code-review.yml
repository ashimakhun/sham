name: Claude Code Review

# Reviews every pull request with Claude Code (anthropics/claude-code-action) and posts the review on the PR:
# an inline comment per issue found, or one summary comment when it finds none. Skips drafts and PRs Claude
# already reviewed. Auth: the CLAUDE_CODE_OAUTH_TOKEN repo secret (from `claude setup-token`, uses the Claude
# subscription, no API billing). The Claude GitHub App must be installed on the repo.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
